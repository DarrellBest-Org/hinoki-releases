name: Feature request
description: Suggest something Hinoki should do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Requests here are public. In Hinoki, Help > Request a Feature fills this in for you.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Hinoki to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead?
